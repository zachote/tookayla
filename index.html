<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TooKayla</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&display=swap');

    :root {
        --bg: #000000;
        --text: #ffffff;
        --muted: #7a7a7a;
        --panel-bg: #0a0a0a;
        --panel-bg-alt: #111111;
        --border: #1d1d1d;
        --border-alt: #2a2a2a;
        --hover-bg: #161616;
        --btn-bg: #ffffff;
        --btn-text: #000000;
        --btn-stop-bg: #b3261e;
        --console-bg: #000000;
        --console-text: #d8d8d8;
        --ok: #ffffff;
        --miss: #5a5a5a;
        --err: #ff5c5c;
        --info: #9a9aff;
        --accent: #ffffff;
    }
    * {
        box-sizing: border-box;
        font-family: 'Red Hat Display', -apple-system, Segoe UI, Arial, sans-serif !important;
    }
    html, body { height: 100%; }
    body {
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        overflow: hidden;
    }
    h1 { text-align: center; margin: 0 0 4px; font-size: 22px; font-weight: 800; }
    .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    .col-console {
        position: fixed;
        top: 0;
        left: 0;
        width: 50vw;
        height: 100vh;
        padding: 20px;
    }
    .col-controls {
        position: fixed;
        top: 0;
        left: 50vw;
        width: 50vw;
        height: 100vh;
        overflow-y: auto;
        padding: 20px 24px;
    }
    .col-controls-inner { display: flex; flex-direction: column; gap: 16px; }

    .panel {
        border: 1px solid var(--border);
        border-radius: 25px;
        padding: 20px;
    }

    .panel-divider {
        height: 1px;
        background: var(--border);
        margin: 18px 0;
        border: none;
    }

    .controls-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
    }
    .controls-row + .controls-row { margin-top: 12px; }

    label.field-label {
        font-size: 11px;
        color: var(--muted);
        margin-right: 4px;
        font-weight: 700;
        letter-spacing: 0.06em;
    }

    input[type="number"], input[type="text"] {
        padding: 10px 12px;
        font-size: 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-family: inherit;
    }
    input[type="number"]:focus, input[type="text"]:focus {
        outline: none;
        border-color: var(--border-alt);
    }
    input[type="text"] { flex: 1; min-width: 200px; }

    button {
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 700;
        background-color: var(--btn-bg);
        color: var(--btn-text);
        border: 1px solid var(--btn-bg);
        border-radius: 14px;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 0.15s, background-color 0.15s, color 0.15s, border-color 0.15s;
        letter-spacing: 0.01em;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    button.secondary {
        background-color: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
    }
    button.secondary:hover { background-color: var(--hover-bg); opacity: 1; }
    button.running { background-color: var(--btn-stop-bg); border-color: var(--btn-stop-bg); color: #ffffff; }
    button.paused { background-color: #a8781e; border-color: #a8781e; color: #ffffff; }

    .console-box {
        background: var(--console-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .console-panel {
        color: var(--console-text);
        padding: 14px 16px;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        font-family: "SF Mono", Consolas, Menlo, monospace;
        font-size: 12.5px;
        line-height: 1.55;
    }
    .log-line { white-space: pre-wrap; word-break: break-word; }
    .log-found { color: var(--ok); font-weight: 600; }
    .log-miss { color: var(--miss); }
    .log-error { color: var(--err); }
    .log-info { color: var(--info); font-weight: 600; }
    .log-time { color: #555; margin-right: 6px; }

    .console-stats {
        flex: 0 0 auto;
        padding: 12px 14px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
    }
    .status-item {
        text-align: center;
        padding: 8px 4px;
        border-radius: 15px;
        background: var(--console-bg);
        border: 1px solid var(--border);
    }
    .status-item .label { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .status-item .value {
        font-size: 14px;
        font-weight: 700;
        margin-top: 3px;
        color: var(--text);
        font-family: "SF Mono", Consolas, Menlo, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .save-status {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
    }

    .field-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 130px; }
    .field-group label.field-label { margin: 0; }
    .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .panel-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .panel-actions button { flex: 1; min-width: 150px; }
    .panel-actions.secondary-row button { flex: 1; min-width: 120px; }

    .search-results { margin-top: 10px; max-height: 320px; overflow-y: auto; }
    .search-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 0; }
    .search-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        margin-bottom: 6px;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
    }
    .search-item:hover { background: var(--hover-bg); border-color: var(--border-alt); }
    .search-item-main { min-width: 0; }
    .search-item-arrow {
        font-size: 15px;
        color: var(--muted);
        flex-shrink: 0;
        opacity: 0;
        transform: translateX(-4px);
        transition: opacity 0.15s, transform 0.15s, color 0.15s;
    }
    .search-item:hover .search-item-arrow { opacity: 1; transform: translateX(0); color: var(--text); }
    .search-item-title { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-item-artist { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-count { font-size: 11px; color: var(--muted); text-align: right; margin-top: 4px; }
    .hint-text { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 10px; line-height: 1.4; }

    button.toggle-mode { background-color: var(--bg); color: var(--text); border: 1px solid var(--border); flex-shrink: 0; }
    button.toggle-mode.active { background-color: var(--accent); color: #000000; border-color: var(--accent); }

    .artist-chip {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--panel-bg-alt);
        margin-bottom: 6px;
        border: 1px solid var(--border);
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        color: var(--text);
    }
    .artist-chip:hover { background: var(--hover-bg); }
    .artist-chip-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .artist-sort-select {
        padding: 10px 12px;
        font-size: 13px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--panel-bg-alt);
        color: var(--text);
        cursor: pointer;
        font-family: inherit;
    }
    .artist-sort-select:focus { outline: none; border-color: var(--border-alt); }
    .artist-chip-count {
        font-size: 11.5px;
        color: var(--muted);
        background: var(--console-bg);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
        flex-shrink: 0;
    }
    .extra-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.extra-toolbar select,.extra-toolbar input{padding:9px 10px;border:1px solid var(--border);border-radius:14px;background:var(--panel-bg-alt);color:var(--text)}
    .mini-stats{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}.mini-stat{background:var(--panel-bg-alt);border:1px solid var(--border);padding:10px;border-radius:14px;text-align:center}.mini-stat b{display:block;font-size:16px}.mini-stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
    .progress{height:8px;background:var(--panel-bg-alt);border-radius:99px;overflow:hidden;margin-top:12px}.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}.scan-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}
    .artist-card{padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--border);margin-bottom:7px;cursor:pointer;transition:background-color 0.15s, border-color 0.15s}.artist-card:hover{background:var(--hover-bg);border-color:var(--border-alt)}.artist-card-top{display:flex;justify-content:space-between}.artist-card-name{font-weight:700}.artist-card-meta{font-size:11px;color:var(--muted);margin-top:5px}
</style>
</head>
<body>
    <div class="col-console">
        <div class="console-box">
            <div class="console-panel" id="console"></div>
            <div class="console-stats">
                <div class="status-item">
                    <div class="label">Saved Releases</div>
                    <div class="value" id="statTotal">–</div>
                </div>
                <div class="status-item">
                    <div class="label">ID Range</div>
                    <div class="value" id="statRange">–</div>
                </div>
                <div class="status-item">
                    <div class="label">Pending Upload</div>
                    <div class="value" id="statPending">0</div>
                </div>
                <div class="status-item">
                    <div class="label">Speed</div>
                    <div class="value" id="statSpeed">–</div>
                </div>
                <div class="status-item">
                    <div class="label">Last Upload</div>
                    <div class="value" id="statUpload">–</div>
                </div>
                <div class="status-item">
                    <div class="label">GitHub API Limit</div>
                    <div class="value" id="statRateLimit">–</div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-controls">

        <div class="col-controls-inner">
            <div class="panel">
                <div class="field-row">
                    <div class="field-group">
                        <label class="field-label" for="startIdInput">Start ID</label>
                        <input type="number" id="startIdInput" placeholder="e.g. 1350000">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="endIdInput">End ID</label>
                        <input type="number" id="endIdInput" placeholder="optional">
                    </div>
                    <div class="field-group" style="max-width: 110px;">
                        <label class="field-label" for="workerInput">Workers</label>
                        <input type="number" id="workerInput" min="1" max="64" value="16">
                    </div>
                </div>
                <div class="panel-actions">
                    <button id="gapFillBtn">Scan Down From ID</button>
                </div>

                <hr class="panel-divider">

                <div class="panel-actions secondary-row">
                    <button id="uploadBtn" class="secondary">Upload New Data</button>
                    <button id="exportBtn" class="secondary">Export JSON</button>
                    <button id="importBtn" class="secondary">Import JSON</button>
                    <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">
                </div>
                <div class="save-status" id="saveStatus"></div>
            </div>

            <div class="panel">
                <div class="controls-row">
                    <input type="text" id="searchInput" placeholder="title, artist, or ID...">
                    <button type="button" id="toggleArtistsBtn" class="toggle-mode">Artists</button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ============ CONFIGURATION ============
    // Your Gist ID — the ID alone is safe to keep in client-side code (it only allows read access).
    const GIST_ID = '2f3945ff4ab15e56a30cb733f6549d34';

    const CONCURRENCY = 16;         // how many requests run at once (worker pool, not batched with delays)
    const REQUEST_TIMEOUT_MS = 12000;
    const MISS_MILESTONE = 30;      // log a reminder every this many consecutive 404s (does NOT stop scanning)
    const MISS_SAFETY_LIMIT = 99999; // safety limit: this many consecutive 404s = stop, to avoid scanning forever on failure (does NOT necessarily mean the end of the range)
    const ERROR_STREAK_LIMIT = 50;  // this many consecutive network errors = stop (something's wrong)
    const MAX_LOG_LINES = 500;      // how many lines to keep in the console (older ones are removed)
    const SPEED_UPDATE_MS = 1000;   // how often to refresh the ID/s counter
    const UPLOAD_BATCH_BYTES = 300 * 1024; // max JSON size per batch sent to /api/save-gist (safely under Vercel's payload limit)

    // ============ STATE ============
    let itemsMap = new Map();   // id -> item
    let minId = null;
    let maxId = null;
    let pendingNewItems = [];
    let lastChunkName = null;

    let isRunning = false;
    let runningDirection = null; // 'up' | 'down' | null
    let isUploading = false;
    let speedIntervalHandle = null;

    let browseMode = 'search'; // 'search' | 'artists'

    // ============ HELPERS ============
    function toBase64(str) {
        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
            (m, p1) => String.fromCharCode('0x' + p1)));
    }

    const consoleEl = document.getElementById('console');
    function log(message, type = 'info') {
        const wasNearBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 60;
        const line = document.createElement('div');
        line.className = `log-line log-${type}`;
        const time = new Date().toLocaleTimeString('en-US');
        line.innerHTML = `<span class="log-time">${time}</span>${escapeHtml(message)}`;
        consoleEl.appendChild(line);
        while (consoleEl.children.length > MAX_LOG_LINES) {
            consoleEl.removeChild(consoleEl.firstChild);
        }
        if (wasNearBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
    }
    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function addItemToMemory(item) {
        const isNew = !itemsMap.has(item.id);
        itemsMap.set(item.id, item);
        if (minId === null || item.id < minId) minId = item.id;
        if (maxId === null || item.id > maxId) maxId = item.id;
        return isNew;
    }

    function updateStatusBar() {
        document.getElementById('statTotal').textContent = itemsMap.size.toLocaleString('en-US');
        document.getElementById('statRange').textContent = (minId !== null && maxId !== null)
            ? `${minId.toLocaleString('en-US')} – ${maxId.toLocaleString('en-US')}`
            : '–';
        document.getElementById('statPending').textContent = pendingNewItems.length.toLocaleString('en-US');
    }

    function setSaveStatus(text) {
        document.getElementById('saveStatus').textContent = text;
    }

    function updateRateLimit(rateLimit) {
        if (!rateLimit || typeof rateLimit.remaining !== 'number') return;
        const el = document.getElementById('statRateLimit');
        let text = `${rateLimit.remaining.toLocaleString('en-US')} / ${rateLimit.limit.toLocaleString('en-US')}`;
        if (rateLimit.resetAt) {
            const resetTime = new Date(rateLimit.resetAt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            text += ` (reset ${resetTime})`;
        }
        el.textContent = text;
        el.style.color = rateLimit.remaining <= 50 ? 'var(--err)' : rateLimit.remaining <= 500 ? '#c98a1d' : '';
    }

    // ============ SAVED RELEASES BROWSER ============
    function normalizeSearch(s) {
        return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    const searchInput = document.getElementById('searchInput');
    const searchResultsEl = document.getElementById('searchResults');
    const toggleArtistsBtn = document.getElementById('toggleArtistsBtn');
    let searchDebounceHandle = null;

    function renderItemsList(items, emptyText, footerText) {
        const shown = items.slice(0, 100);
        if (items.length === 0) {
            return `<div class="search-empty">${emptyText}</div>`;
        }
        return shown.map(item => `
            <a class="search-item" href="${escapeHtml(`https://toolost.com/release-preview/${toBase64(item.id.toString())}`)}" target="_blank" rel="noopener">
                <div class="search-item-main">
                    <div class="search-item-title">${escapeHtml(item.title)}</div>
                    <div class="search-item-artist">${escapeHtml(item.artist)} · ID ${item.id}</div>
                </div>
                <span class="search-item-arrow">→</span>
            </a>
        `).join('') + (items.length > shown.length
            ? `<div class="search-count">Showing ${shown.length} of ${items.length} results.</div>`
            : `<div class="search-count">${footerText || `${items.length} result(s).`}</div>`);
    }

    // List of artists shown in the "Artists" tab.
    // Intentionally limited to just these five names.
    const IMPORTANT_ARTISTS = [
        'Ayesha Erotica',
        'BJ Lips',
        'shitzulover07',
        'Cece Natalie',
        'MISS LUXURY'
    ];

    // Splits the "artist" field into individual names, so releases with multiple
    // artists (e.g. "BJ Lips, Olive Ugly" or "BJ Lips x Olive Ugly") can be matched
    // against EACH artist separately, not just the whole combined string.
    function splitArtists(raw) {
        return (raw || '')
            .split(/,|\/|&|\+| x | X |\bfeat\.?\b|\bft\.?\b|\band\b|\bwith\b/)
            .map(s => s.trim())
            .filter(Boolean);
    }

    // The artist list is built EXCLUSIVELY from IMPORTANT_ARTISTS (see above) —
    // for every saved release, we check whether ANY of the split artist names
    // matches (after normalization) one of the artists on the list. This way
    // releases credited to multiple artists are counted too, while no one
    // outside IMPORTANT_ARTISTS ever shows up on the list.
    function getArtistsList() {
        const stats = new Map(IMPORTANT_ARTISTS.map(display => [normalizeSearch(display), { display, count: 0, minId: null, maxId: null }]));
        for (const item of itemsMap.values()) {
            const parts = splitArtists(item.artist);
            const matchedKeys = new Set(parts.map(normalizeSearch).filter(k => stats.has(k)));
            for (const k of matchedKeys) {
                const s = stats.get(k);
                s.count++;
                if (s.minId === null || item.id < s.minId) s.minId = item.id;
                if (s.maxId === null || item.id > s.maxId) s.maxId = item.id;
            }
        }
        const list = Array.from(stats.values());
        list.sort((a, b) => a.display.localeCompare(b.display, 'en'));
        return list;
    }

    function renderArtistsList() {
        const artists=getArtistsList();
        searchResultsEl.innerHTML=artists.map(a=>`<div class="artist-card" data-artist="${escapeHtml(a.display)}"><div class="artist-card-top"><span class="artist-card-name">${escapeHtml(a.display)}</span><b>${a.count}</b></div><div class="artist-card-meta">${a.count?`ID ${a.minId.toLocaleString('en-US')} → ${a.maxId.toLocaleString('en-US')}`:'No saved releases'}</div></div>`).join('')+'<div class="search-count">Artist list.</div>';
    }

    function renderSearchResults() {
        if (browseMode === 'artists') { renderArtistsList(); return; }

        const raw = searchInput.value.trim();
        if (raw === '') {
            searchResultsEl.innerHTML = '';
            return;
        }

        const terms = normalizeSearch(raw).split(/\s+/).filter(Boolean);
        const idQuery = /^\d+$/.test(raw) ? raw : null;
        const matches = [];
        for (const item of itemsMap.values()) {
            if (idQuery !== null && item.id.toString().includes(idQuery)) {
                matches.push(item);
                continue;
            }
            const hay = normalizeSearch(`${item.title} ${item.artist}`);
            if (terms.every(t => hay.includes(t))) matches.push(item);
        }
        matches.sort((a, b) => b.id - a.id);
        searchResultsEl.innerHTML = renderItemsList(matches, 'No results.', `${matches.length} result(s).`);
    }

    function setBrowseMode(mode) {
        browseMode = mode;
        toggleArtistsBtn.classList.toggle('active', browseMode !== 'search');
        toggleArtistsBtn.textContent = browseMode === 'search' ? 'Artists' : 'Releases';
        renderSearchResults();
    }


    searchInput.addEventListener('input', () => {
        if (browseMode !== 'search') {
            setBrowseMode('search');
        }
        clearTimeout(searchDebounceHandle);
        searchDebounceHandle = setTimeout(renderSearchResults, 150);
    });

    toggleArtistsBtn.addEventListener('click', () => {
        if (browseMode === 'search') {
            setBrowseMode('artists');
        } else {
            setBrowseMode('search');
        }
    });

    searchResultsEl.addEventListener('click', (e) => {
        const card = e.target.closest('.artist-card');
        if (!card) return;
        searchInput.value = card.dataset.artist;
        setBrowseMode('search');
        searchInput.focus();
    });

    let session={checked:0,found:0,miss:0,errors:0,lastId:null};
    let lastScan={nextId:null,endId:null};
    function exportItems(items,name){const blob=new Blob([JSON.stringify(items.sort((a,b)=>a.id-b.id),null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
    document.getElementById('workerInput').addEventListener('change',e=>{e.target.value=Math.max(1,Math.min(64,Number(e.target.value)||16));});

    function setButtonsForRunningState() {
        const gapFillBtn = document.getElementById('gapFillBtn');
        gapFillBtn.classList.toggle('running', isRunning && runningDirection === 'gapfill');
        gapFillBtn.textContent = isRunning && runningDirection === 'gapfill'
            ? 'Stop (gap fill)'
            : 'Scan Down From ID (skip saved, fill gaps)';
        gapFillBtn.disabled = isRunning && runningDirection !== 'gapfill';
    }

    // ============ LOADING FROM GIST (with automatic retry until it succeeds) ============
    const CHUNK_RETRY_BASE_DELAY_MS = 1000;
    const CHUNK_RETRY_MAX_DELAY_MS = 15000;

    function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }
    function retryDelay(attempt) { return Math.min(CHUNK_RETRY_BASE_DELAY_MS * 2 ** (attempt - 1), CHUNK_RETRY_MAX_DELAY_MS); }

    // Fetches the Gist metadata, retrying (with growing delay) until it succeeds.
    async function fetchGistMetaWithRetry() {
        let attempt = 0;
        while (true) {
            attempt++;
            try {
                const resp = await fetch(`https://api.github.com/gists/${GIST_ID}`);
                if (!resp.ok) throw new Error(`status ${resp.status}`);
                return await resp.json();
            } catch (err) {
                const delay = retryDelay(attempt);
                log(`Failed to load the Gist (attempt ${attempt}): ${err.message}. Retrying in ${Math.round(delay / 1000)}s...`, 'error');
                await sleep(delay);
            }
        }
    }

    // Fetches and parses a single chunk_*.json file, retrying until it succeeds.
    async function loadChunkWithRetry(name, file) {
        let attempt = 0;
        while (true) {
            attempt++;
            try {
                let content = file.content;
                if (file.truncated) {
                    const rawResp = await fetch(file.raw_url);
                    if (!rawResp.ok) throw new Error(`status ${rawResp.status}`);
                    content = await rawResp.text();
                }
                const parsed = JSON.parse(content);
                if (!Array.isArray(parsed)) throw new Error('expected a JSON array');
                parsed.forEach(item => addItemToMemory(item));
                if (attempt > 1) log(`Read ${name} after ${attempt} attempts.`, 'info');
                return;
            } catch (err) {
                const delay = retryDelay(attempt);
                log(`Failed to read file ${name} from Gist (attempt ${attempt}): ${err.message}. Retrying in ${Math.round(delay / 1000)}s...`, 'error');
                await sleep(delay);
            }
        }
    }

    async function loadFromGist() {
            const gist = await fetchGistMetaWithRetry();
            const chunkNames = Object.keys(gist.files).filter(n => /^chunk_\d+\.json$/.test(n)).sort();

            for (const name of chunkNames) {
                await loadChunkWithRetry(name, gist.files[name]);
                updateStatusBar();
            }
            lastChunkName = chunkNames.length ? chunkNames[chunkNames.length - 1] : null;
            updateStatusBar();
            renderSearchResults();
            log(`Loaded ${itemsMap.size.toLocaleString('en-US')} releases from Gist (ID range ${minId}–${maxId}).`, 'info');
    }

    // ============ UPLOAD TO GIST (manual) ============
    // ============ SENDING TO HOSTING (in batches — a single request can't be too large) ============
    function makeUploadBatches(items, maxBytes) {
        const batches = [];
        let current = [];
        let currentSize = 2; // array brackets
        for (const item of items) {
            const itemSize = JSON.stringify(item).length + 1;
            if (current.length > 0 && currentSize + itemSize > maxBytes) {
                batches.push(current);
                current = [];
                currentSize = 2;
            }
            current.push(item);
            currentSize += itemSize;
        }
        if (current.length > 0) batches.push(current);
        return batches;
    }

    async function uploadToGist() {
        if (isUploading) return;
        if (pendingNewItems.length === 0) {
            setSaveStatus('No new items to upload.');
            return;
        }
        isUploading = true;
        document.getElementById('uploadBtn').disabled = true;
        const toSend = pendingNewItems;
        pendingNewItems = [];
        updateStatusBar();

        const batches = makeUploadBatches(toSend, UPLOAD_BATCH_BYTES);
        log(`Uploading ${toSend.length} items in ${batches.length} batches (limit ~${Math.round(UPLOAD_BATCH_BYTES / 1024)}KB/batch)...`, 'info');

        let totalSent = 0;
        for (let i = 0; i < batches.length; i++) {
            const batch = batches[i];
            setSaveStatus(`Uploading batch ${i + 1}/${batches.length} (${batch.length} items)...`);
            try {
                const resp = await fetch('/api/save-gist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: batch, lastChunkName })
                });
                const result = await resp.json();
                updateRateLimit(result.rateLimit);
                if (!resp.ok || !result.ok) {
                    const remaining = batch.concat(...batches.slice(i + 1));
                    pendingNewItems = remaining.concat(pendingNewItems);
                    updateStatusBar();
                    setSaveStatus(`Upload error on batch ${i + 1}/${batches.length}: ${result.error || resp.status}. The rest was returned to the queue — try again.`);
                    log(`Failed to upload batch ${i + 1}/${batches.length}: ${result.error || resp.status}`, 'error');
                    break;
                }
                if (result.lastChunkName) lastChunkName = result.lastChunkName;
                totalSent += batch.length;
                log(`Uploaded batch ${i + 1}/${batches.length} (${batch.length} items).`, 'info');
            } catch (err) {
                const remaining = batch.concat(...batches.slice(i + 1));
                pendingNewItems = remaining.concat(pendingNewItems);
                updateStatusBar();
                setSaveStatus(`Network error on batch ${i + 1}/${batches.length}: ${err.message}. The rest was returned to the queue — try again.`);
                log(`Network error while uploading batch ${i + 1}/${batches.length}: ${err.message}`, 'error');
                break;
            }
        }

        if (totalSent === toSend.length) {
            const now = new Date().toLocaleTimeString('en-US');
            document.getElementById('statUpload').textContent = now;
            setSaveStatus(`Saved ${totalSent} items to hosting (${now}).`);
            log(`Uploaded a total of ${totalSent} new releases to hosting (${batches.length} batches).`, 'info');
        }

        isUploading = false;
        document.getElementById('uploadBtn').disabled = false;
    }
    document.getElementById('uploadBtn').addEventListener('click', uploadToGist);

    // ============ LOCAL EXPORT (backup) ============
    document.getElementById('exportBtn').addEventListener('click', () => {
        const allItems = Array.from(itemsMap.values()).sort((a, b) => a.id - b.id);
        const blob = new Blob([JSON.stringify(allItems)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `toolost_backup_${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        log(`Exported a local backup (${allItems.length} items).`, 'info');
    });

    // ============ LOCAL IMPORT (from a JSON file) ============
    // Accepts both an export file (an array of items) and a single "chunk_*.json" from the Gist.
    // New items are added to itemsMap (visible right away in the search) and to pendingNewItems,
    // so they can be uploaded normally with the "Upload New Data" button.
    document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        e.target.value = ''; // allows selecting the same file again later
        if (!file) return;

        let parsed;
        try {
            const text = await file.text();
            parsed = JSON.parse(text);
        } catch (err) {
            log(`Failed to read file "${file.name}": ${err.message}`, 'error');
            return;
        }

        const items = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.items) ? parsed.items : null);
        if (!items) {
            log(`File "${file.name}" doesn't contain an array of releases (expected [...] or { items: [...] }).`, 'error');
            return;
        }

        let added = 0, duplicates = 0, invalid = 0;
        for (const raw of items) {
            const rawId = typeof raw?.id !== 'undefined' ? raw.id : raw?.currentId;
            if (!raw || typeof rawId === 'undefined' || rawId === null) { invalid++; continue; }
            const id = Number(rawId);
            if (!Number.isFinite(id)) { invalid++; continue; }

            const item = {
                id,
                title: raw.title || 'Unknown Title',
                artist: raw.artist || 'Unknown Artist'
            };

            const isNew = addItemToMemory(item);
            if (isNew) {
                added++;
                pendingNewItems.push(item);
            } else {
                duplicates++;
            }
        }

        updateStatusBar();
        renderSearchResults();
        log(`Import "${file.name}": added ${added} new, ${duplicates} already saved${invalid ? `, ${invalid} skipped (missing/invalid id)` : ''}.`, 'info');
        if (added > 0) {
            setSaveStatus(`Imported ${added} new items — click "Upload New Data" to save them permanently.`);
        }
    });

    // ============ FETCHING A SINGLE ID (with retry and timeout) ============
    async function fetchOne(id, attempt) {
        attempt = attempt || 1;
        const encodedId = toBase64(id.toString());
        const url = `https://toolost.com/release-preview/${encodedId}`;
        const controller = new AbortController();
        const timeoutHandle = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

        try {
            const resp = await fetch(url, { method: 'GET', mode: 'cors', signal: controller.signal });
            clearTimeout(timeoutHandle);

            if (resp.status === 404) return { id, status: 'notfound' };
            if (!resp.ok) {
                if (attempt < 2) return fetchOne(id, attempt + 1);
                return { id, status: 'error', message: `HTTP ${resp.status}` };
            }

            const html = await resp.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const titleEl = doc.querySelector('.rp-title');
            if (!titleEl) return { id, status: 'notfound' };

            const artistEl = doc.querySelector('.rp-artists');
            const title = titleEl.textContent.trim();
            const artist = artistEl ? artistEl.textContent.trim() : 'Unknown Artist';
            return { id, status: 'found', title, artist };
        } catch (err) {
            clearTimeout(timeoutHandle);
            if (attempt < 2) return fetchOne(id, attempt + 1);
            return { id, status: 'error', message: err.name === 'AbortError' ? 'request timed out' : err.message };
        }
    }

    // ============ SCANNING DOWN FROM A GIVEN ID — SKIPS ALREADY SAVED, FILLS GAPS ============
    // Starts at startId and works its way down one by one. For each ID: if it's already in
    // itemsMap (i.e. we already have it saved), skip it without making a network request —
    // just move on. If the ID isn't saved yet, fetch it normally — this fills gaps within the
    // range already scanned. Once past the entire known range (below the lowest known ID),
    // everything is "unknown", so it just keeps going like a regular downward scan — it
    // doesn't stop just because it went past the previously known range.
    async function scanDownFillGaps(startId) {
        let nextIdToAssign = startId;
        let missStreak = 0;
        let lastMilestoneAt = 0;
        let errorStreak = 0;
        let boundaryLogged = false;
        let safetyLogged = false;
        let errorLogged = false;
        let checkedSinceTick = 0;
        let skippedTotal = 0;

        log(`Starting gap fill: from ID ${startId} downward, skipping already-saved IDs, ${CONCURRENCY} concurrent requests.`, 'info');

        const speedEl = document.getElementById('statSpeed');
        speedIntervalHandle = setInterval(() => {
            speedEl.textContent = `${checkedSinceTick} ID/s`;
            checkedSinceTick = 0;
        }, SPEED_UPDATE_MS);

        function claimNextId() {
            let skipStart = null, skipEnd = null;
            while (true) {
                if (document.getElementById('endIdInput').value.trim() && nextIdToAssign < Number(document.getElementById('endIdInput').value)) return null;
                if (nextIdToAssign < 1) {
                    if (skipStart !== null) {
                        skippedTotal += (skipStart - skipEnd + 1);
                        log(`… skipped ${(skipStart - skipEnd + 1).toLocaleString('en-US')} already-saved IDs (${skipStart} → ${skipEnd})`, 'info');
                    }
                    return null;
                }
                const id = nextIdToAssign;
                nextIdToAssign--;
                if (itemsMap.has(id)) {
                    if (skipStart === null) skipStart = id;
                    skipEnd = id;
                    continue;
                }
                if (skipStart !== null) {
                    skippedTotal += (skipStart - skipEnd + 1);
                    log(`… skipped ${(skipStart - skipEnd + 1).toLocaleString('en-US')} already-saved IDs (${skipStart} → ${skipEnd})`, 'info');
                }
                return id;
            }
        }

        async function worker() {
            while (isRunning) {
                const id = claimNextId();
                if (id !== null) lastScan={nextId:id-1,endId:document.getElementById('endIdInput').value.trim()?Number(document.getElementById('endIdInput').value):null};
                if (id === null) {
                    if (!boundaryLogged) {
                        boundaryLogged = true;
                        log('Finished: reached the lower boundary of the ID range (1).', 'info');
                    }
                    isRunning = false;
                    break;
                }

                const res = await fetchOne(id);
                checkedSinceTick++; session.checked++; session.lastId=id;

                if (res.status === 'found') {
                    session.found++;
                    const item = { id: res.id, title: res.title, artist: res.artist };
                    const isNew = addItemToMemory(item);
                    if (isNew) pendingNewItems.push(item);
                    missStreak = 0;
                    lastMilestoneAt = 0;
                    errorStreak = 0;
                    log(`✔ ID ${res.id} — "${res.title}" — ${res.artist}`, 'found');
                    updateStatusBar();
                } else if (res.status === 'notfound') {
                    session.miss++; missStreak++;
                    errorStreak = 0;
                    log(`— ID ${res.id}: no release (404)`, 'miss');
                    if (missStreak - lastMilestoneAt >= MISS_MILESTONE) {
                        lastMilestoneAt = missStreak;
                        log(`Note: ${missStreak} consecutive IDs with no release — this may just be a gap in the numbering, scan continuing.`, 'info');
                    }
                    if (missStreak >= MISS_SAFETY_LIMIT) {
                        if (!safetyLogged) {
                            safetyLogged = true;
                            log(`Stopped (safety limit): ${MISS_SAFETY_LIMIT} consecutive IDs with no release. This does NOT necessarily mean the end of the range. Resume manually if you want to keep scanning further down.`, 'error');
                        }
                        isRunning = false;
                    }
                } else if (res.status === 'error') {
                    session.errors++; errorStreak++;
                    log(`✖ ID ${res.id}: error — ${res.message}`, 'error');
                    if (errorStreak >= ERROR_STREAK_LIMIT) {
                        if (!errorLogged) {
                            errorLogged = true;
                            log(`Stopped: ${ERROR_STREAK_LIMIT} consecutive network errors — check your connection or whether the site is blocking requests.`, 'error');
                        }
                        isRunning = false;
                    }
                }
            }
        }

        const workers = [];
        const workerCount=Math.max(1,Math.min(64,parseInt(document.getElementById('workerInput').value,10)||CONCURRENCY));
        for (let i = 0; i < workerCount; i++) workers.push(worker());
        await Promise.all(workers);

        clearInterval(speedIntervalHandle);
        speedEl.textContent = '–';
        runningDirection = null;
        setButtonsForRunningState();
        log(`Gap fill stopped. Skipped a total of ${skippedTotal.toLocaleString('en-US')} already-saved IDs.`, 'info');
    }
    function handleGapFillClick() {
        if (isRunning && runningDirection === 'gapfill') {
            isRunning = false; // toggle: second click stops it
            log('Stopping gap fill (once current requests finish)...', 'info');
            return;
        }
        if (isRunning) return; // another mode is already running (button is disabled anyway)

        const startRaw = document.getElementById('startIdInput').value.trim();
        if (startRaw === '') {
            log('Enter a start ID for the downward scan to begin from.', 'error');
            return;
        }
        const startId = parseInt(startRaw, 10);
        if (isNaN(startId) || startId < 1) {
            log('Invalid start ID.', 'error');
            return;
        }

        isRunning = true;
        runningDirection = 'gapfill';
        setButtonsForRunningState();
        scanDownFillGaps(startId);
    }

    document.getElementById('gapFillBtn').addEventListener('click', handleGapFillClick);

    // ============ APP START ============
    async function init() {
        setButtonsForRunningState();
        updateStatusBar();
        await loadFromGist();
        updateStatusBar();
    }
    init();
</script>
</body>
</html>
